<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太陽黒点 観測カレンダー</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --text-color: #f0f0f0;
            --accent-color: #ff9800;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 16px auto;
        }

        .calendar-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 0;
        }

        .nav-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: #2c2c2c;
        }

        .calendar-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        /* 曜日ヘッダー */
        .weekday-header {
            text-align: center;
            font-weight: bold;
            padding: 8px 0;
            background-color: var(--card-bg);
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .weekday-header.sat {
            color: #64b5f6;
        }

        .weekday-header.sun {
            color: #e57373;
        }

        /* 日付セル */
        .day-cell {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
        }

        .day-cell.empty {
            background-color: transparent;
            border: none;
        }

        .day-number {
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 4px;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 6px;
            border-radius: 4px;
            align-self: flex-start;
            z-index: 1;
        }

        /* YouTubeサムネイルリンク */
        .sun-link {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            text-decoration: none;
            flex-grow: 1;
        }

        .sun-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .sun-link:hover img {
            transform: scale(1.08);
        }

        .sun-link::after {
            content: '▶ 再生';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sun-link:hover::after {
            opacity: 1;
        }

        .no-obs {
            font-size: 0.7rem;
            color: #666;
            text-align: center;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1rem;
            color: var(--accent-color);
        }

        /* --- スマホ表示最適化（画面幅600px以下） --- */
        @media (max-width: 600px) {
            body {
                padding: 4px 2px;
            }

            .calendar-header {
                margin-bottom: 8px;
            }

            .calendar-title {
                font-size: 1.0rem;
            }

            .nav-btn {
                padding: 4px 8px;
                font-size: 0.8rem;
            }

            .calendar-grid {
                gap: 3px;
            }

            .weekday-header {
                padding: 4px 0;
                font-size: 0.7rem;
            }

            .day-cell {
                padding: 2px;
                min-height: 52px;
                border-radius: 4px;
            }

            .day-number {
                font-size: 0.65rem;
                padding: 1px 3px;
                margin-bottom: 2px;
            }

            .sun-link::after {
                display: none;
            }

            .no-obs {
                font-size: 0.55rem;
                margin-top: 6px;
            }
        }
    </style>
</head>

<body>

    <div class="calendar-header">
        <button class="nav-btn" id="prev-btn">&lt; 前月</button>
        <h1 class="calendar-title" id="month-title">観測カレンダー</h1>
        <button class="nav-btn" id="next-btn">翌月 &gt;</button>
    </div>

    <div class="calendar-container">
        <div id="loading" class="loading">データを読み込み中...</div>
        <div class="calendar-grid" id="calendar-grid" style="display: none;"></div>
    </div>

    <script>
        // ============================================================
        // 設定：GoogleスプレッドシートのWeb公開CSV URLをここに貼ります
        // ============================================================
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTf68iAWJyYLndvW809zF732wqoSIZ0fkt2Gsc25e3cLE-7d87M02y54sy3-cdxICrW7j-_9B5EFLpX/pub?output=csv';

        let observationData = {}; // 日付 => { videoId, url }
        let currentDate = new Date(); // 現在表示中の年月

        // YouTube URLから動画IDを抽出する関数
        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // 日付表記を「YYYY-MM-DD」フォーマットに正規化
        function normalizeDate(dateStr) {
            const parts = dateStr.split(/[\/\-]/);
            if (parts.length === 3) {
                const y = parts[0].trim();
                const m = parts[1].trim().padStart(2, '0');
                const d = parts[2].trim().padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
            return null;
        }

        // GoogleスプレッドシートのCSVデータを取得・解析
        async function fetchCSVData() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();

                const lines = csvText.split(/\r?\n/);
                lines.forEach((line, index) => {
                    if (index === 0) return; // ヘッダー行をスキップ
                    const cols = line.split(',');
                    if (cols.length >= 2) {
                        const rawDate = cols[0].replace(/['"]/g, '').trim();
                        const rawUrl = cols[1].replace(/['"]/g, '').trim();

                        const dateKey = normalizeDate(rawDate);
                        const videoId = extractYouTubeId(rawUrl);

                        if (dateKey && videoId) {
                            observationData[dateKey] = {
                                videoId: videoId,
                                url: rawUrl
                            };
                        }
                    }
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('calendar-grid').style.display = 'grid';
                renderCalendar(currentDate);

            } catch (error) {
                document.getElementById('loading').textContent = 'データの読み込みに失敗しました。';
                console.error('CSV Fetch Error:', error);
            }
        }

        // カレンダーの描画処理（月曜始まり）
        function renderCalendar(date) {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const year = date.getFullYear();
            const month = date.getMonth(); // 0-indexed

            // ヘッダータイトルの更新
            document.getElementById('month-title').textContent = `${year}年${month + 1}月`;

            // 曜日ヘッダーを追加 (月曜始まり)
            const weekdays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            weekdays.forEach((day, idx) => {
                const header = document.createElement('div');
                header.className = 'weekday-header';
                if (idx === 5) header.classList.add('sat');
                if (idx === 6) header.classList.add('sun');
                header.textContent = day;
                grid.appendChild(header);
            });

            // 当月1日の曜日を取得 (0:日, 1:月, ... 6:土)
            const firstDay = new Date(year, month, 1).getDay();
            // 月曜始まりのオフセット計算 (月:0, 火:1, ..., 日:6)
            const startOffset = (firstDay + 6) % 7;

            // 当月の総日数
            const lastDate = new Date(year, month + 1, 0).getDate();

            // 月初の空白セルを生成
            for (let i = 0; i < startOffset; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                grid.appendChild(emptyCell);
            }

            // 各日付のセルを生成
            for (let day = 1; day <= lastDate; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';

                const dayNum = document.createElement('span');
                dayNum.className = 'day-number';
                dayNum.textContent = day;
                cell.appendChild(dayNum);

                // キー用日付文字列（YYYY-MM-DD）を作成
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

                if (observationData[dateKey]) {
                    // 観測データが存在する場合：YouTubeサムネイルを表示
                    const data = observationData[dateKey];
                    const link = document.createElement('a');
                    link.className = 'sun-link';
                    link.href = data.url;
                    // 新しいタブで開く設定（推奨）
                    //link.target = '_blank';
                    // もし新しいタブで開かない場合は、親画面全体を切り替える設定にする
                    link.target = '_top';
                    link.rel = 'noopener noreferrer';

                    const img = document.createElement('img');
                    // 高画質サムネイル (hqdefault.jpg)
                    img.src = `https://img.youtube.com/vi/${data.videoId}/hqdefault.jpg`;
                    img.alt = `${dateKey} 太陽黒点`;

                    link.appendChild(img);
                    cell.appendChild(link);
                } else {
                    // 観測データがない場合
                    const noData = document.createElement('span');
                    noData.className = 'no-obs';
                    noData.textContent = 'No-Obj';
                    cell.appendChild(noData);
                }

                grid.appendChild(cell);
            }
        }

        // 月移動ボタンのイベントハンドラ
        document.getElementById('prev-btn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar(currentDate);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar(currentDate);
        });

        // 初回データ読み込み実行
        fetchCSVData();
    </script>

</body>

</html>
